<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" width="360" height="540" role="img" aria-label="مخطط نسقي لحساب مجموع الأعداد الزوجية الأقل من 20">
<title>مخطط نسقي لحساب مجموع الأعداد الزوجية الأقل من 20</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<style>
text{font-family:"Segoe UI",Tahoma,Arial,"Noto Sans Arabic",sans-serif;text-anchor:middle;dominant-baseline:central;fill:#000}
.s{fill:#fff;stroke:#000;stroke-width:2}
.a{fill:none;stroke:#000;stroke-width:2;marker-end:url(#ah)}
.l{fill:none;stroke:#000;stroke-width:2}
</style>
</defs>
<rect width="360" height="540" fill="#fff"/>
<rect class="s" x="125" y="10" width="110" height="36" rx="18"/><text x="180" y="28" font-size="14" direction="rtl">بداية</text><polyline class="a" points="180,46 180,68"/><rect class="s" x="120" y="68" width="120" height="50"/><text x="180" y="84" font-size="14">s ← 0</text><text x="180" y="102" font-size="14">i ← 2</text><text x="290" y="93" font-size="11" direction="rtl" fill="#555">تهيئة</text><polyline class="a" points="180,118 180,150"/><polygon class="s" points="180,150 250,190 180,230 110,190"/><text x="180" y="190" font-size="14">i &lt; 20 ?</text><polyline class="a" points="180,230 180,258"/><text x="196" y="244" font-size="13" direction="rtl" font-weight="bold">نعم</text><rect class="s" x="110" y="258" width="140" height="36"/><text x="180" y="276" font-size="14">s ← s + i</text><polyline class="a" points="180,294 180,316"/><rect class="s" x="110" y="316" width="140" height="36"/><text x="180" y="334" font-size="14">i ← i + 2</text><polyline class="a" points="180,352 180,374 40,374 40,136 180,136"/><text transform="rotate(-90 40 255)" x="40" y="255" font-size="12" direction="rtl" fill="#555" style="paint-order:stroke;stroke:#fff;stroke-width:6px">تكرار</text><polyline class="a" points="250,190 320,190 320,410 180,410 180,430"/><text x="275" y="178" font-size="13" direction="rtl" font-weight="bold">لا</text><polygon class="s" points="129,430 245,430 231,466 115,466"/><text x="180" y="448" font-size="14">Ecrire(s)</text><polyline class="a" points="180,466 180,490"/><rect class="s" x="125" y="490" width="110" height="36" rx="18"/><text x="180" y="508" font-size="14" direction="rtl">نهاية</text>
</svg>
