    - listitem [ref=f4e139]: ظهور معاينة للشريحة الهدف.
  - heading "إنشاء ارتباط تشعبي إلى شريحة في عرض تقديمي آخر" [level=4] [ref=f4e140]
  - list [ref=f4e141]:
    - listitem [ref=f4e142]: 1. في العرض Normal، نحدد النص أو الكائن الذي نريد استخدامه كارتباط تشعبي.
    - listitem [ref=f4e143]: "2. ضمن علامة التبويب Insertion، في المجموعة Liens، ننقر على Lien hypertexte (أو ننقر بالزر الأيمن على التحديد ثم على Lien hypertexte): تظهر علبة حوار باسم Insérer un lien hypertexte."
    - listitem [ref=f4e144]: 3. في المربع Lier à، ننقر على Fichier ou page Web existante(e).
    - listitem [ref=f4e145]: 4. نحدد موقع العرض التقديمي الذي يحتوي على الشريحة التي نريد الارتباط بها.
    - listitem [ref=f4e146]: 5. ننقر على "إشارة مرجعية" Signet…، تظهر علبة حوار باسم "Sélectionner un emplacement dans le document".
    - listitem [ref=f4e147]: 6. ننقر على عنوان الشريحة التي نريد الارتباط بها، ثم ننقر على OK (لإغلاق هذه العلبة).
    - listitem [ref=f4e148]: 7. ننقر على OK (لإغلاق علبة الحوار السابقة).
