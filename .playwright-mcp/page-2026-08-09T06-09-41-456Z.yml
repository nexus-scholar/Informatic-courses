  - heading "3. الارتباطات التشعبية" [level=3] [ref=f4e124]
  - paragraph [ref=f4e125]: لقد أدرجنا، عند حل النشاط السابق، أزرار إجراءات سمحت لنا بالانتقال من شريحة إلى أخرى، وهذا ما نسميه "ارتباطًا تشعبيًا".
  - paragraph [ref=f4e126]: ما هو الارتباط التشعبي؟
  - paragraph [ref=f4e127]: الارتباط التشعبي هو اتصال من شريحة لأخرى في نفس العرض التقديمي، أو إلى شريحة في عرض تقديمي آخر، أو عنوان بريد إلكتروني، أو صفحة Web، أو ملف.
  - paragraph [ref=f4e128]: يمكننا إنشاء ارتباط تشعبي من نص أو كائن، مثل صورة أو رسم بياني أو شكل أو WordArt.
  - paragraph [ref=f4e129]: إنشاء ارتباط تشعبي إلى شريحة في نفس العرض التقديمي
