  - paragraph [ref=f4e24]: تخطيط الشريحة الأولى
  - paragraph [ref=f4e25]: "الشريحة 1: العنوان: \"سؤال وجواب\"، العنوان الفرعي: \"تقويم حول برنامج العروض التقديمية PowerPoint\"، إدراج صورة أو أكثر من مكتبة الصور."
  - paragraph [ref=f4e26]: "الشريحة 2: العنوان: \"الأسئلة\"، إدراج SmartArt من شكل قائمة تحوي الأسئلة المقترحة (على الأقل ثلاثة)."
  - paragraph [ref=f4e27]: "الشريحة 3: العنوان: \"السؤال الأول\"، إدراج مربع نص السؤال الأول، إدراج SmartArt من شكل قائمة تحوي الإجابات المقترحة (على الأقل ثلاثة)."
  - list [ref=f4e28]:
    - listitem [ref=f4e29]: "الشريحة 4: العنوان: \"السؤال الثاني\"، إدراج مربع نص السؤال الثاني، إدراج SmartArt من شكل قائمة تحوي الإجابات المقترحة (على الأقل ثلاثة)."
    - listitem [ref=f4e30]: "الشريحة 5: العنوان: \"السؤال الثالث\"، إدراج مربع نص السؤال الثالث، إدراج SmartArt من شكل قائمة تحوي الإجابات المقترحة (على الأقل ثلاثة)."
  - paragraph [ref=f4e31]: "الشريحة 6: العنوان: \"إجابة صحيحة\"، إدراج مربعي نص \"أحسنت\" و\"العودة إلى الأسئلة\"، إدراج شكل \"وجه ضاحك\"."
  - paragraph [ref=f4e32]: "الشريحة 7: العنوان: \"إجابة خاطئة\"، إدراج مربعي نص \"حاول مرة أخرى\" و\"العودة إلى الأسئلة\"، إدراج شكل \"وجه عبوس\"."
  - paragraph [ref=f4e33]: "بعد التنسيق قد تبدو الشرائح في عرض \"فارز الشرائح\" كما يلي:"
  - paragraph [ref=f4e34]:
    - img "Image" [ref=f4e35]
  - paragraph [ref=f4e36]: "عند تنفيذ العرض يتم عرض الشرائح حسب تسلسلها:"
  - paragraph [ref=f4e37]: الشريحة 1 الشريحة 2 الشريحة 3 الشريحة 4 ... وهكذا
  - paragraph [ref=f4e38]: "الإشكالية: كيف ننتقل مثلا من الشريحة الثانية إلى الشريحة الخامسة لعرض السؤال الثالث؟"
  - paragraph [ref=f4e39]: وكيف ننتقل إلى شريحة الإجابة الصحيحة إذا كانت إجابتنا بالفعل صحيحة؟
  - paragraph [ref=f4e40]: وكيف نعود بعد ذلك لاختيار سؤال آخر؟
  - paragraph [ref=f4e41]: "لتحقيق هذا: يجب أن يكون عرضنا التقديمي تفاعليًا."
  - paragraph [ref=f4e42]: للتحكم في تسلسل عرض الشرائح ندرج "أزرار إجراءات".
