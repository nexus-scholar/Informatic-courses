  - 'heading "1. نشاط: عرض تقديمي \"سؤال وجواب\"" [level=3] [ref=f4e16]'
  - paragraph [ref=f4e17]: نريد إنشاء عرض تقديمي، المطلوب فيه اختيار الإجابة الصحيحة من عدة إجابات مقترحة لعدة أسئلة، ويكون إظهار شريحة للإجابة الصحيحة وأخرى للإجابة الخاطئة حسب الحالة، ثم الرجوع لاختيار سؤال آخر.
  - list [ref=f4e18]:
    - listitem [ref=f4e19]: شغل برنامج PowerPoint
    - listitem [ref=f4e20]: "أنشئ عرضًا تقديميًا يتكون من 4 شرائح (على الأقل) كما في الشكل التالي:"
