  - list [ref=f4e133]:
    - listitem [ref=f4e134]: اربط كل سؤال من شريحة "الأسئلة" بالشريحة المناسبة له.
    - listitem [ref=f4e135]: "اربط كل إجابة بالشريحة الموافقة لها: صحيحة أو خاطئة."
  - heading "لاحظ:" [level=4] [ref=f4e136]
  - list [ref=f4e137]:
