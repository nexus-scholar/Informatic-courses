  - paragraph [ref=f2e33]: الوسم em هو اختصار لكلمة "emphasis"، أو الوسم i، يجعل النص "مائلاً"، وكل النصوص بين وسم البداية &lt;em&gt; ووسم الإغلاق &lt;/em&gt; ستظهر بشكل مائل في المتصفح.
  - code [ref=f2e35]: <em>نص مائل</em>
  - list [ref=f2e36]:
    - listitem [ref=f2e37]: "المثال 2:"
  - paragraph [ref=f2e38]: الوسم b هو اختصار لكلمة Bold أو الوسم strong للخط العريض، ويأتي في صورة زوج من الوسوم، وسم للفتح ووسم للإغلاق.
  - code [ref=f2e40]: HTML is a <b>Great</b> Language
  - paragraph [ref=f2e41]: "وعند استخدام المتصفح في مشاهدة السطر سيظهر هكذا:"
  - paragraph [ref=f2e42]: "سيظهر بهذا الشكل في المتصفح: HTML is a Great Language"
  - heading "ملاحظات:" [level=4] [ref=f2e43]
  - list [ref=f2e44]:
    - listitem [ref=f2e45]: جميع عناصر ملف HTML يتم إدراجها عن طريق الوسوم، وتحدد خصائصها أيضاً عن طريق الوسوم.
    - listitem [ref=f2e46]: لغة HTML لا تراعي حالة الأحرف من حيث كونها كبيرة أو صغيرة، أي أنه في HTML الوسم &lt;b&gt; لا يختلف عن &lt;B&gt;.
    - listitem [ref=f2e47]: بعض الوسوم تحتاج إلى وسم إغلاق وبعضها لا يحتاج إليه، مثلاً الوسم &lt;br&gt; الذي يستخدم لتحديد نهاية السطر وبداية سطر جديد ليس له وسم إغلاق.
    - listitem [ref=f2e48]: لغة HTML لا تراعي الفراغات والمسافات البيضاء، أما الفراغات فتعتبر رموزاً خاصة أيضاً، وللتحكم بها نستخدم الوسم non breakable space (&amp;nbsp)، وإذا أردنا إدخال عدة فراغات بين نص وآخر ما علينا إلا كتابة هذا الوسم بنفس الفراغات المطلوبة.
    - listitem [ref=f2e49]: توضع التعليقات بين &lt;!-- و --&gt;، أي أن المتصفح يتجاهل أي شيء بينهما وكأنه غير موجود.
