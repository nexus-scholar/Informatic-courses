  - heading "8 الارتباطات التشعبية" [level=3] [ref=f2e201]
  - paragraph [ref=f2e202]: تعد الارتباطات التشعبية من أهم مكونات صفحة الويب، لأنها هي المسؤولة عن ربط مجموعة من صفحات الويب المختلفة بينها، مما يتيح للمستخدم التنقل عبرها بسهولة.
  - paragraph [ref=f2e203]: لإنجاز وصلة نستخدم الوسم a وهي اختصار لكلمة anchor، وهي لا تعمل لوحدها ولكن تتطلب خصائص معينة، من أهمها الخاصية href وهي اختصار "hypertext reference"، لتحديد الوجهة.
  - list [ref=f2e204]:
    - listitem [ref=f2e205]: "الوجهة قد تكون صفحة من موقع خارجي، وعندها يبدأ العنوان بـ http:"
  - code [ref=f2e207]: <a href="http://www.microsoft.com/">Microsoft Corp.</a><br> <a href="http://www.microsoft.com/">cliquer ici.</a><br>
  - paragraph [ref=f2e208]:
    - img "Image" [ref=f2e209]
  - paragraph [ref=f2e210]: "يمكننا إدراج صورة أو زر كبديل عن الكلمات:"
  - code [ref=f2e212]: <a href="http://www.microsoft.com/"><img src="new.gif"></a><br>
  - list [ref=f2e213]:
    - listitem [ref=f2e214]: "الوجهة قد تكون ملفاً موجوداً في نفس الموقع، سواء كانت صفحة أو صورة أو غير ذلك:"
  - code [ref=f2e216]: <a href="صفحتي.htm">الصفحة الأولى</a><br>
  - code [ref=f2e218]: <a href="velo.gif"><img src="velo.gif">انقر على الصورة</a><br>
  - paragraph [ref=f2e219]:
    - img "Image" [ref=f2e220]
  - list [ref=f2e221]:
    - listitem [ref=f2e222]: "الوجهة قد تكون عنواناً لبريد إلكتروني، وعندها يبدأ بـ mailto:"
  - code [ref=f2e224]: <a href="mailto:nordine@hotmail.com">Mon E-mail</a>
  - list [ref=f2e225]:
    - listitem [ref=f2e226]: الوجهة قد تكون مكاناً ما داخل نفس الصفحة، أولها، أخيرها أو أي مكان نريده.
  - paragraph [ref=f2e227]: بإمكاننا إنشاء روابط داخلية ضمن الصفحة، كل ما تحتاجه هي خاصية تسمى id أو "identification"، والعلامة "#".
  - paragraph [ref=f2e228]: "استخدم خاصية id لتضع إشارة للعنصر الذي تريد وضع رابط له، مثال:"
  - code [ref=f2e230]: <p><a href="#heading1">انتقل إلى العنوان رقم 1</a></p> <p><a href="#heading2">انتقل إلى العنوان رقم 2</a></p> <h1 id="heading1">العنوان رقم 1</h1> <p>نص... نص... نص...</p> <h1 id="heading2">العنوان رقم 2</h1> <p>نص... نص... نص...</p>
  - paragraph [ref=f2e231]:
    - img "Image" [ref=f2e232]
  - heading "9 الجداول" [level=3] [ref=f2e233]
  - paragraph [ref=f2e234]: تعتبر الجداول من أهم مكونات صفحات HTML، وجميع التصاميم الاحترافية تستفيد من الجداول لتصميم الصفحة وتوزيع الكائنات عليها وتشكيلها في القالب الذي يريدونه.
  - paragraph [ref=f2e235]: يتم إدراج الجدول بالوسم &lt;table&gt;، وداخل الجدول يجب إدراج صفوف باستخدام الوسم &lt;tr&gt; وتعني "table row"، وداخل الصفوف توجد البيانات بالوسم &lt;td&gt; وهو اختصار "table data"، وهذا الوسم يبدأ وينهي كل خلية في صفوف الجدول.
  - paragraph [ref=f2e236]: يمكن وضع إطار للجدول بالخاصية border، حيث نحدد فيها سماكة الإطار المطلوب. القيمة الافتراضية للإطار هي 0 أي بدون إطار.
  - paragraph [ref=f2e237]:
    - img "Image" [ref=f2e238]
  - paragraph [ref=f2e239]:
    - img "Image" [ref=f2e240]
  - heading "الخاصية cellspacing و cellpadding" [level=4] [ref=f2e241]
  - paragraph [ref=f2e242]: "يمكننا التحكم بالمسافة بين الخلايا بواسطة الخاصية cellspacing، والمسافة بين الحدود الداخلية للخلايا ومحتوياتها بواسطة الخاصية cellpadding:"
  - paragraph [ref=f2e243]:
    - img "Image" [ref=f2e244]
  - code [ref=f2e246]: <table cellspacing="10" cellpadding="20" border="1"> <tr> <td>الخلية الأولى</td> <td>الخلية الثانية</td> </tr> </table>
  - heading "الخاصية width و height" [level=4] [ref=f2e247]
  - paragraph [ref=f2e248]: "يمكن التحكم بعرض الجدول بالخاصية width وارتفاعه بالخاصية height، وكلاهما يأخذ قيماً مطلقة أو نسباً مئوية، ويمكن استخدام هذه الخصائص في الخلايا td أيضاً:"
  - code [ref=f2e250]: <table width="100%" height="100%" border="1"> <tr> <td width="100" height="40%">الخلية الأولى</td> <td width="100%" height="40%">الخلية الثانية</td> </tr> </table>
  - list [ref=f2e251]:
    - listitem [ref=f2e252]: "الخاصية bgcolor: التحكم في لون خلفية الجدول."
    - listitem [ref=f2e253]: "الخاصية background: تعيين صورة الخلفية للجدول."
  - paragraph [ref=f2e254]: "يمكن استعمال هذه الخواص في الخلايا td أيضاً، وعند تعيين قيمة bgcolor للجدول مختلفة عن قيمة أحد الخلايا، فإن لون الخلية سيطغى على لون الجدول في تلك الخلية، لأن الخلية موجودة فوق الجدول في ترتيب الطبقات:"
  - code [ref=f2e256]: <table border="1" width="90%" height="80%"> <tr> <td bgcolor="Yellow">الخلية الأولى</td> <td>الخلية الثانية</td> </tr> </table>
  - paragraph [ref=f2e257]:
    - img "Image" [ref=f2e258]
  - heading "الخاصية align" [level=4] [ref=f2e259]
  - paragraph [ref=f2e260]: يمكن التحكم بمحاذاة محتوى الخلية أفقياً بالخاصية align.
  - paragraph [ref=f2e261]: في الخاصية align، القيمة left تعني محاذاة لليسار، وright لليمين، وcenter للمنتصف، وjustify للضبط الكلي الذي يجعل الأسطر متساوية في الطول.
  - heading "الخاصية valign" [level=4] [ref=f2e262]
  - paragraph [ref=f2e263]: يمكن التحكم بمحاذاة محتوى الخلية رأسياً بالخاصية valign.
  - paragraph [ref=f2e264]: في الخاصية valign، تأخذ القيمة top للأعلى، وbottom للأسفل.
