    - listitem [ref=f2e54]: "الرأس: Head — يحتوي على المعلومات الإضافية الخاصة بالمستند من حيث، مثلاً، عنوان الصفحة والكلمات المفتاحية فيها وغيرها من الأمور الخاصة بالصفحة والتي لا تعتبر من ضمن محتوى المستند."
    - listitem [ref=f2e55]: "العنوان: Title — يحتوي على عنوان المستند."
    - listitem [ref=f2e56]: "الجسم: Body — وهو يحتوي على محتوى المستند الذي يراه المستخدم."
