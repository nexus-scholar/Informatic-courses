  - heading "1 مقدمة" [level=3] [ref=f2e6]
  - paragraph [ref=f2e7]: يظن بعض الناس أن إنشاء المواقع عملية صعبة معقدة، وهذا ليس صحيحاً، فيمكن للجميع تعلم كيفية إنشاء المواقع. الهدف من هذا الدرس هو مقدمة سهلة في كيفية إنشاء المواقع، وهذا الدرس لا يتطلب أي معرفة مسبقة منك عن البرمجة أو تطوير المواقع.
  - heading "2 ما هي HTML" [level=3] [ref=f2e8]
  - paragraph [ref=f2e9]: هي اللغة المستخدمة في إنشاء وتصميم صفحات الويب.
  - paragraph [ref=f2e10]: اخترعت HTML في عام 1991م من قبل عالم يسمى تيم بيرنرزلي، الهدف من هذه اللغة هو تبسيط عملية وصول العلماء في جامعات مختلفة إلى البحوث التي ينشرونها. المشروع نجح بشكل لم يتصوره تيم بيرنرزلي، فباختراعه HTML قام تيم بيرنرزلي بوضع أساس شبكة الويب كما نعرفها اليوم.
  - paragraph [ref=f2e11]: "هي لغة تسمح بعرض المعلومات (مثال: البحوث العلمية) على شبكة الإنترنت، وهذا ما نراه عند زيارتنا لأي صفحة في الشبكة."
  - heading "3 ماذا تعني H-T-M-L؟" [level=3] [ref=f2e12]
  - paragraph [ref=f2e13]: كلمة HTML هي اختصار "HyperText Markup Language"،
  - list [ref=f2e14]:
    - listitem [ref=f2e15]: HYPER هي عكس "خطي"، وهي تعني في هذه الحالة أن ننتقل من أي نقطة إلى أي نقطة بدون أن نسير في خط سير محدد.
    - listitem [ref=f2e16]: Text تعني النص.
    - listitem [ref=f2e17]: Mark-up هو ما نفعله بالنص، فهذه الكلمة تعني توصيف النص، فنحن نقوم بتوصيف النص تماماً كما نفعل مع معالجات النصوص والكلمات، فنضيف العناوين والنقاط والنص السميك وغيرها.
    - listitem [ref=f2e18]: Language تعني اللغة، فتقنية HTML هي لغة توصيف.
  - paragraph [ref=f2e19]: تكتب ملفات HTML في صورة ملفات نصوص بسيطة (Text)، تأخذ الامتداد .html عادة، وتكتب في أي برنامج للنصوص البسيطة، في الويندوز نستخدم Notepad++.
  - paragraph [ref=f2e20]: لغة HTML لغة وصفية سهلة جداً ذات قدرات عالية وميزات فريدة وقوية، جميع الصفحات العالمية متقنة التصميم تم إعدادها باستخدام لغة HTML، وتتميز HTML أيضاً بأنها ذات قواعد سهلة ومعروفة.
