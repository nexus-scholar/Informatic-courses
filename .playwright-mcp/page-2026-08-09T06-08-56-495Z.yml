  - paragraph [ref=f2e151]: يمكننا تنظيم المحتوى في لغة HTML في عدة أشكال، مثلاً وضعه في صورة قائمة مرتبة، أو في صورة شجرة (مخطط هرمي).
  - paragraph [ref=f2e152]: يمكننا إنجاز قائمة مرتبة بالتعداد الرقمي باستخدام الوسم ol وهي اختصار "ordered list"، وقائمة غير مرتبة بالتعداد النقطي باستخدام الوسم ul وهي اختصار "unordered list"، بحيث توضع البنود بينهما، وكل بند يحدد بالوسم li وهي اختصار "list item".
  - paragraph [ref=f2e153]: "يمكننا تحديد نوع الترقيم في القوائم المرتبة بالحروف أو بالأرقام العربية أو الرومانية وغيرها عبر الخاصية type، وتأخذ أحد القيم التالية:"
