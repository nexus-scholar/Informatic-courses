  - paragraph [ref=f2e164]: يمكننا في لغة HTML عرض الصور في الصفحات والتحكم في خواصها.
  - heading "ملاحظة:" [level=4] [ref=f2e165]
  - paragraph [ref=f2e166]: يجب أن تكون الصورة جاهزة للنشر على الويب، أي أن لا تكون ذات حجم كبير لأن ذلك سيؤدي إلى بطء شديد في التحميل، لذلك يفضل التقليل من الصور قدر الإمكان في صفحات HTML.
  - paragraph [ref=f2e167]: لكي نستطيع عرض الصور في المستند، يجب أن تكون الصورة من النوع JPEG أو GIF أو PNG.
