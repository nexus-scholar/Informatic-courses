  - paragraph [ref=f2e23]: "تتكون ملفات HTML من قسمين:"
  - list [ref=f2e24]:
    - listitem [ref=f2e25]: "المحتوى: وهو ما يشاهده الجمهور في صفحتك."
  - paragraph [ref=f2e26]: الوسوم (Tags) هي الأجزاء التي تحدد وتصف المحتوى من حيث التنسيق. الوسوم هي توصيفات نستخدمها ونضعها في بداية العنصر وعند نهايته. كل الوسوم لها نفس الشكل، تبدأ مع علامة أصغر من "&lt;" وتنتهي مع علامة أكبر من "&gt;".
  - code [ref=f2e28]: <html> .............................................</html>
  - paragraph [ref=f2e29]: "بشكل عام هناك نوعان من الوسوم، وسم البداية مثلاً: &lt;html&gt; ثم وسم الإغلاق &lt;/html&gt;. الفرق بين الاثنين هو علامة \"/\"، وتوصيف المحتوى يكون بوضعه بين وسم البداية ووسم الإغلاق."
  - paragraph [ref=f2e30]: "بعض الأمثلة:"
  - list [ref=f2e31]:
