  - 'heading "مثال 4: حساب متوسط القيم الموجودة في النطاق A1:A10" [level=4] [ref=f1e66]'
  - list [ref=f1e67]:
    - listitem [ref=f1e68]: "الحل 1: باستعمال الصيغة: =(A1+A2+A3+A4+A5+A6+A7+A8+A9+A10)/10"
  - paragraph [ref=f1e69]: "بالتأكيد من الأفضل استعمال الدوال:"
  - list [ref=f1e70]:
    - listitem [ref=f1e71]: "الحل 2: باستعمال دالة المجموع: =SOMME(A1:A10)/10"
  - list [ref=f1e72]:
    - listitem [ref=f1e73]: "الحل 3 وهو الأفضل: استعمال دالة الوسط الحسابي: =MOYENNE(A1:A10)"
  - 'heading "من فوائد استعمال الدوال: تبسيط الصيغ" [level=4] [ref=f1e74]'
  - heading "مراجعة:" [level=4] [ref=f1e75]
  - 'heading "الدالة SOMME: دالة المجموع" [level=4] [ref=f1e76]'
  - list [ref=f1e77]:
    - listitem [ref=f1e78]: "=SOMME(A1;C3:D12;2): جمع محتوى الخلية A1 ومحتوى خلايا النطاق C3:D12 والقيمة 2."
    - listitem [ref=f1e79]: "=SOMME(E:E): جمع محتويات خلايا العمود E."
  - paragraph [ref=f1e80]: ألا يؤدي استخدام كل العمود كنطاق في دالة إلى بطء العمليات الحسابية؟
  - paragraph [ref=f1e81]: هذا الاعتقاد غير صحيح، لأن Excel يتعقب آخر خلايا العمود التي تم استخدامها ولن يستخدم الخلايا التي تقع بعدها عند حساب نتيجة الصيغة.
  - list [ref=f1e82]:
    - listitem [ref=f1e83]: نضغط على المفتاح Entrer.
  - 'heading "الدالة MOYENNE: الوسط الحسابي" [level=4] [ref=f1e84]'
  - list [ref=f1e85]:
    - listitem [ref=f1e86]: "=MOYENNE(A1:D20): جمع الأعداد الموجودة في النطاق A1:D20 وقسمتها على عدد هذه الأعداد."
    - listitem [ref=f1e87]: "=MOYENNE(E:E): الوسط الحسابي لأعداد العمود E."
  - heading "حل الإشكالية 1" [level=3] [ref=f1e88]
  - heading "حساب معدل الفروض" [level=4] [ref=f1e89]
  - paragraph [ref=f1e90]: نريد جمع محتويات الخلايا C7، D7، E7 ونضع الناتج في الخلية F7.
  - heading "الخطوات:" [level=4] [ref=f1e91]
  - list [ref=f1e92]:
    - listitem [ref=f1e93]: 1. في الخلية F7 نكتب = ثم القوس (.
    - listitem [ref=f1e94]: 2. ننقر على الخلية C7 ثم نكتب +.
    - listitem [ref=f1e95]: 3. ننقر على الخلية D7 ثم نكتب +.
    - listitem [ref=f1e96]: 4. ننقر على الخلية E7.
    - listitem [ref=f1e97]: 5. ندخل رمز القسمة / ثم 3.
  - paragraph [ref=f1e98]: نحصل على معدل الرياضيات 13.17.
  - paragraph [ref=f1e99]: لنسخ الصيغة ولصقها نستعمل مقبض التعبئة (+) ونسحب إلى الأسفل.
  - heading "النتيجة:" [level=4] [ref=f1e100]
  - paragraph [ref=f1e101]: بالنسبة للمواد الأساسية نحصل على نتائج صحيحة. لكن بالنسبة للمواد غير الأساسية فإن النتائج تكون خاطئة، إذ سنجمع قيمتين فقط ونقسم على ثلاثة.
  - heading "الحل:" [level=4] [ref=f1e102]
  - paragraph [ref=f1e103]: يمكن كتابة صيغة أخرى بالنسبة للمواد غير الأساسية، لكن الأفضل استعمال الدالة Moyenne.
  - list [ref=f1e104]:
    - listitem [ref=f1e105]: 1. في الخلية F7 نكتب =.
    - listitem [ref=f1e106]: 2. ننقر على التبويب Formules.
    - listitem [ref=f1e107]: 3. من الأوامر الموجودة في المجموعة Bibliothèque de fonctions ننقر على Somme automatique.
    - listitem [ref=f1e108]: 4. تنسدل قائمة، ننقر على Moyenne.
    - listitem [ref=f1e109]: 5. نحدد النطاق C7:E7.
    - listitem [ref=f1e110]: 6. نضغط على المفتاح Entrer.
  - paragraph [ref=f1e111]: ننسخ الدالة ونلصقها باستعمال مقبض التعبئة (+) والسحب إلى الأسفل.
  - heading "أمثلة أخرى" [level=4] [ref=f1e112]
  - paragraph [ref=f1e113]: "مثال 5: يمكن إدراج دالة داخل صيغة."
  - paragraph [ref=f1e114]: إذا كان محتوى الخلية A1 هو قيمة نصف قطر دائرة.
  - paragraph [ref=f1e115]: "لحساب محيط هذه الدائرة نكتب في الخلية B1 الصيغة التالية:"
  - paragraph [ref=f1e116]:
    - text: =2
    - emphasis [ref=f1e117]: PI()
    - text: A1
  - paragraph [ref=f1e118]: حيث PI() دالة ترجع قيمة π.
  - 'heading "ملاحظة: وسائط الدالة" [level=4] [ref=f1e119]'
  - paragraph [ref=f1e120]: كل الدوال تستعمل أقواسا ()، وما بداخل الأقواس هي وسائط الدالة.
  - paragraph [ref=f1e121]: قد يكون للدالة وسيط أو أكثر، وقد يكون عدد الوسائط محددا أو غير محدد، وقد يكون اختياريا، وقد تكون دالة بدون وسيط.
  - list [ref=f1e122]:
    - listitem [ref=f1e123]: ليس للدالة PI() وسيط.
    - listitem [ref=f1e124]: "للدالة الجذر التربيعي RACINE وسيط واحد: RACINE(A1) ترجع الجذر التربيعي لمحتوى الخلية A1."
    - listitem [ref=f1e125]: تقبل الدالة SOMME وسيطا أو أكثر.
    - listitem [ref=f1e126]: للتفريق بين الوسائط نستعمل الفاصلة أو النقطة الفاصلة حسب إعدادات الجهاز.
    - listitem [ref=f1e127]: لعرض الصيغة في الخلية بدل النتيجة ننقر على علامة التبويب Formules.
    - listitem [ref=f1e128]: ضمن المجموعة Audit de formules ننقر على الأمر Afficher les formules.
  - 'heading "مثال 6: ما هي أكبر قيمة في النطاق A1:E1000؟" [level=4] [ref=f1e129]'
  - paragraph [ref=f1e130]: لا يمكن استخدام صيغة للإجابة على هذا السؤال.
  - paragraph [ref=f1e131]: "الحل: استخدام الدالة MAX: =MAX(A1:E1000)"
  - paragraph [ref=f1e132]: "من فوائد استعمال الدوال: تنفيذ حسابات لا يمكن تنفيذها باستعمال الصيغ."
  - paragraph [ref=f1e133]:
    - img "Image" [ref=f1e134]
  - heading "مراجعة:" [level=4] [ref=f1e135]
  - 'heading "الدالة MAX: أكبر قيمة" [level=4] [ref=f1e136]'
  - list [ref=f1e137]:
    - listitem [ref=f1e138]: "=MAX(A1;D1:D5;9): إيجاد أكبر قيمة من محتوى الخلية A1 ومحتويات الخلايا في النطاق D1:D5 والعدد 9."
  - 'heading "الدالة MIN: أصغر قيمة" [level=4] [ref=f1e139]'
  - list [ref=f1e140]:
    - listitem [ref=f1e141]: "=MIN(A1;D1:D5;9): إيجاد أصغر قيمة من محتوى الخلية A1 ومحتويات الخلايا في النطاق D1:D5 والعدد 9."
  - heading "3. إدراج دالة" [level=3] [ref=f1e142]
  - paragraph [ref=f1e143]: "لإدراج دالة يمكن اتباع إحدى الطرائق التالية:"
  - list [ref=f1e144]:
    - listitem [ref=f1e145]: 1. كتابة الدالة يدويا، ستجد أن المجدول يوفر لك ميزة الإكمال التلقائي.
    - listitem [ref=f1e146]: 2. النقر على التبويب Formules واستعمال أمر من الأوامر الموجودة في المجموعة Bibliothèque de fonctions.
    - listitem [ref=f1e147]: 3. بالنقر على Insérer une fonction "إدراج دالة" تظهر علبة حوار للبحث عن دالة أو اختيار دالة من الفئات المتوفرة.
  - paragraph [ref=f1e148]:
    - img "Image" [ref=f1e149]
  - paragraph [ref=f1e150]:
    - img "Image" [ref=f1e151]
  - paragraph [ref=f1e152]:
    - img "Image" [ref=f1e153]
  - paragraph [ref=f1e154]: بعد النقر على OK تظهر علبة حوار أخرى لإدخال وسائط الدالة.
  - paragraph [ref=f1e155]:
    - img "Image" [ref=f1e156]
  - list [ref=f1e157]:
    - listitem [ref=f1e158]: 4. بالنقر على Somme automatique "جمع تلقائي" ثم اختيار إحدى الدوال المألوفة من القائمة المنسدلة أو النقر على الأمر Autres fonctions "دوال إضافية".
    - listitem [ref=f1e159]: 5. بالنقر على إحدى الفئات المعروضة مثلا "المنطقية" Logique.
    - listitem [ref=f1e160]: 6. النقر على الرمز في شريط الصيغة.
  - paragraph [ref=f1e161]:
    - img "Image" [ref=f1e162]
  - list [ref=f1e163]:
    - listitem [ref=f1e164]: "7. الاختصار: Maj+F3."
  - heading "4. الإشكالية 2" [level=3] [ref=f1e165]
  - paragraph [ref=f1e166]: "لحساب معدل المادة في العمود H: نضرب \"معدل الفروض\" بالمعامل 2 و\"الاختبار\" بالمعامل 1، نجمع الناتجين ثم نقسم على 3."
  - paragraph [ref=f1e167]: هل توجد دالة لحساب هذا المعدل أم أننا مجبرون على استعمال صيغة؟
  - heading "حل الإشكالية 2" [level=3] [ref=f1e168]
  - paragraph [ref=f1e169]: "لا توجد دالة لحساب معدل المادة بالطريقة المطلوبة، لذلك يجب كتابة صيغة لحساب هذا المعدل كما يلي:"
  - list [ref=f1e170]:
    - listitem [ref=f1e171]: 1. في الخلية H7 نكتب = ثم القوس (.
    - listitem [ref=f1e172]: 2. ننقر على الخلية F7 ثم نكتب *2.
    - listitem [ref=f1e173]: 3. نكتب + ثم ننقر على الخلية G7.
    - listitem [ref=f1e174]: 4. نكتب *1 ثم القوس ).
    - listitem [ref=f1e175]: 5. ندخل رمز القسمة / ثم 3.
    - listitem [ref=f1e176]: 6. نضغط على المفتاح Entrer.
  - heading "5. الإشكالية 3" [level=3] [ref=f1e177]
  - heading "إدراج قرار في كشف نقاط التلميذ" [level=4] [ref=f1e178]
  - paragraph [ref=f1e179]: في كشف نقاط نهاية السنة الدراسية، نريد إدراج عمود للنتيجة يكون فيه محتوى الخلية "ناجح" إذا كان المعدل السنوي للتلميذ أكبر من أو يساوي 10 و"راسب" في الحالات الأخرى.
  - paragraph [ref=f1e180]: هل توجد دالة نستخدمها لهذه العملية؟
  - paragraph [ref=f1e181]: بالفعل هي الدالة الشرطية SI.
  - 'heading "من فوائد استعمال الدوال: التنفيذ الشرطي للصيغ، مما يسمح باتخاذ القرارات." [level=4] [ref=f1e182]'
  - heading "6. الدالة SI" [level=3] [ref=f1e183]
  - paragraph [ref=f1e184]: من أهم الدوال استخداما في Excel الدالة الشرطية SI "إذا كان" التي تمكّن الصيغة من اتخاذ القرار.
  - paragraph [ref=f1e185]: "عبارة الدالة: =SI(الشرط; القيمة إذا تحقق الشرط; القيمة إذا لم يتحقق الشرط)"
  - heading "حل الإشكالية 3" [level=3] [ref=f1e186]
  - paragraph [ref=f1e187]: "الشرط: المعدل السنوي أكبر من أو يساوي 10: B2&gt;=10"
  - paragraph [ref=f1e188]: "إذا تحقق الشرط: تظهر عبارة \"ناجح\" في الخلية من العمود \"النتيجة\"."
  - paragraph [ref=f1e189]: "إذا لم يتحقق الشرط: تظهر عبارة \"راسب\" في الخلية من العمود \"النتيجة\"."
  - list [ref=f1e190]:
    - listitem [ref=f1e191]: 1. نضغط على المفتاح Entrer.
    - listitem [ref=f1e192]: 2. ننسخ الصيغة ونلصقها بالسحب من مقبض التعبئة (+) إلى الأسفل فنحصل على النتائج.
  - paragraph [ref=f1e193]: "ملاحظة: نحصل على نفس النتيجة باستعمال الصيغة =SI(B2&lt;10;\"راسب\";\"ناجح\")."
  - 'heading "مثال: إدراج عمود للتهنئة" [level=4] [ref=f1e194]'
  - paragraph [ref=f1e195]: "نريد إدراج عمود للتهنئة بحيث: إذا كان محتوى خلية \"النتيجة\" هو \"ناجح\" يصبح محتوى خلية التهنئة من العمود D هو \"مبروك\" وإلا نترك خلية التهنئة فارغة."
  - heading "الحل:" [level=4] [ref=f1e196]
  - paragraph [ref=f1e197]: في الخلية D2 نكتب الدالة (لاحظ الصورة)، نضغط على المفتاح Entrer ثم ننسخ ونلصق الدالة.
  - paragraph [ref=f1e198]:
    - img "Image" [ref=f1e199]
  - paragraph [ref=f1e200]: "لاحظ كيف تمثل الخلية الفارغة في الدالة: \" \"."
  - heading "7. الإشكالية 4" [level=3] [ref=f1e201]
  - heading "\"راسب ناجح!\" و\"ناجح راسب!\"" [level=4] [ref=f1e202]
  - paragraph [ref=f1e203]: نظرا لنجاح عدة تلاميذ رغم مستوياتهم الضعيفة في اللغة العربية، قررت وزارة التربية أنّه لا يعتبر ناجحا إلا من تحصل على معدل سنوي أكبر من أو يساوي 10 ويكون معدله في اللغة العربية أيضا أكبر من أو يساوي 10.
  - paragraph [ref=f1e204]: نلاحظ وجود شرطين في هذه الإشكالية من الواجب أن يتحققا معا، لذلك نلجأ إلى استخدام الدالة المنطقية "و" ET مع الدالة الشرطية SI.
