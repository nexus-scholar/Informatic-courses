  - heading "التعليمات الأساسية للغة الخوارزمية:" [level=4] [ref=f3e153]
  - paragraph [ref=f3e154]: "التعليمة: هي أمر يسمح للجهاز بتحديد العملية المراد إنجازها."
  - paragraph [ref=f3e155]: "يمكن التعبير عن مسار حل مسألة ما لكتابة خوارزمية بواسطة التعليمات الخمسة الآتية:"
  - list [ref=f3e156]:
    - listitem [ref=f3e157]: 1. تعليمة الإسناد.
    - listitem [ref=f3e158]: 2. تعليمة القراءة (أو إدخال المعطيات).
    - listitem [ref=f3e159]: 3. تعليمة الكتابة (أو إظهار النتائج).
    - listitem [ref=f3e160]: 4. التعليمة الشرطية.
    - listitem [ref=f3e161]: 5. التعليمة التكرارية.
  - paragraph [ref=f3e162]: "##### 1. تعليمة الإسناد Instruction d'affectation"
  - paragraph [ref=f3e163]: تسمح بإسناد قيمة محددة أو نتيجة صيغة إلى متغير ما في الخانة الذاكرة (case mémoire) المحجوزة له.
  - paragraph [ref=f3e164]: "الشكل النظامي (Syntaxe):"
  - code [ref=f3e166]: Nom de variable ← Expression
  - list [ref=f3e167]:
    - listitem [ref=f3e168]: Nom de variable يمثل اسم المعرف (Identificateur).
    - listitem [ref=f3e169]: Expression قد تكون قيمة ثابتة أو نتيجة دالة أو اسم متغير آخر، كما يمكن أن تكون نتيجة لعبارة حسابية.
  - paragraph [ref=f3e170]: "المعنى: المتغير يأخذ قيمة الصيغة."
  - paragraph [ref=f3e171]: "مثال:"
  - code [ref=f3e173]: Surface_rect ← largeur * longueur PI ← 3.14
  - paragraph [ref=f3e174]: "##### 2. تعليمة القراءة Instruction de lecture"
  - paragraph [ref=f3e175]: تسمح بإدخال قيمة إلى الجهاز بواسطة لوحة المفاتيح ووضعها في خانة ذاكرة.
  - paragraph [ref=f3e176]: "الشكل النظامي (Syntaxe):"
  - code [ref=f3e178]: Lire(Nom de variable)
  - paragraph [ref=f3e179]: "المعنى: هذه التعليمة أمر يطلب أخذ القيمة المعطاة بواسطة لوحة المفاتيح ووضعها في الخانة الذاكرة المحجوزة للمتغير."
  - paragraph [ref=f3e180]: "أمثلة:"
  - list [ref=f3e181]:
    - listitem [ref=f3e182]: "Lire(N): معناه ضع القيمة المعطاة من لوحة المفاتيح في الخانة الذاكرة المحجوزة لـ N."
    - listitem [ref=f3e183]: "Lire(a, b, c): معناه ضع القيم المعطاة من لوحة المفاتيح في الخانات الذاكرة المحجوزة لـ a، b و c على الترتيب."
  - paragraph [ref=f3e184]: "##### 3. تعليمة الكتابة Instruction d'écriture"
  - paragraph [ref=f3e185]: تسمح بإظهار قيمة معينة على الشاشة.
  - paragraph [ref=f3e186]: "الشكل النظامي (Syntaxe):"
  - code [ref=f3e188]: Ecrire("Expression")
  - paragraph [ref=f3e189]: "المعنى: هذه التعليمة أمر بإظهار الصيغة المحصورة بين المزدوجتين على الشاشة."
  - paragraph [ref=f3e190]: "أمثلة:"
  - code [ref=f3e192]: Ecrire("Entrez la valeur de S")
  - paragraph [ref=f3e193]: "هذه التعليمة تسمح بإظهار الصيغة الآتية على الشاشة: Entrez la valeur de S"
  - code [ref=f3e195]: Ecrire("2") Ecrire(5 - 3)
  - paragraph [ref=f3e196]: هاتان التعليمتان تسمحان بإظهار 2 على الشاشة.
  - paragraph [ref=f3e197]: "##### 4. التعليمة الشرطية Instruction conditionnelle"
  - paragraph [ref=f3e198]: "تطلب الخوارزمية في بعض الحالات أثناء الكتابة إلى بعض التعليمات بالتناوب (غير متسلسلة)، يطلق عليها اسم التعليمات الشرطية التي تقيد بشرط معين، إذا تحقق هذا الأخير نقوم بعملية وإلا نقوم بعملية أخرى. نميز نوعين من التعليمات الشرطية هما:"
  - paragraph [ref=f3e199]: "###### أ. التعليمة الشرطية البسيطة:"
  - paragraph [ref=f3e200]: إذا تحقق الشرط تنفذ التعليمة.
  - paragraph [ref=f3e201]: "الشكل النظامي:"
  - code [ref=f3e203]: Si <Condition> alors <Instructions>
  - paragraph [ref=f3e204]: "المعنى: تنفذ مجموعة التعليمات <Instructions> إذا تحقق الشرط <Condition>."
  - paragraph [ref=f3e205]: "###### ب. التعليمة الشرطية الاختيارية:"
  - paragraph [ref=f3e206]: إذا تحقق الشرط تنفذ مجموعة من التعليمات، وإلا تنفذ مجموعة أخرى من التعليمات.
  - paragraph [ref=f3e207]: "الشكل النظامي:"
  - code [ref=f3e209]: Si <Condition> alors <liste d'instructions 1> Sinon <liste d'instructions 2> FinSi
  - paragraph [ref=f3e210]:
    - img "Image" [ref=f3e211]
  - paragraph [ref=f3e212]: Suite de l'algorithme
  - paragraph [ref=f3e213]: "مثال: كتابة الخوارزمية التي تسمح بإظهار على الشاشة نتيجة نجاح تلميذ أو رسوبه."
  - code [ref=f3e215]: "Algorithme Elève_admis Variable Moyenne : réel Début Lire(Moyenne) Si Moyenne >= 10 Alors Ecrire(\"L'élève est admis\") Sinon Ecrire(\"L'élève est ajourné\") FinSi Fin"
  - paragraph [ref=f3e216]:
    - img "Image" [ref=f3e217]
  - paragraph [ref=f3e218]: "##### 5. التعليمة التكرارية Instruction répétitive"
  - paragraph [ref=f3e219]: "يستعمل هذا النوع لتكرار تنفيذ مجموعة من التعليمات، يرتبط هذا التكرار بتحقق شرط معين، ومادام هذا الشرط محققًا يعاد تنفيذ مجموعة من التعليمات. هناك نوعان من التعليمات التكرارية:"
  - list [ref=f3e220]:
    - listitem [ref=f3e221]: التعليمة التكرارية Tant que
    - listitem [ref=f3e222]: التعليمة التكرارية Pour
  - paragraph [ref=f3e223]:
    - img "Image" [ref=f3e224]
  - paragraph [ref=f3e225]: "###### أ. التعليمة التكرارية Tant que"
  - paragraph [ref=f3e226]: في حالة عدم معرفة عدد التكرارات لتنفيذ التعليمات وارتباط التكرار بتحقيق شرط معين نستعمل الحلقة Tant que.
  - paragraph [ref=f3e227]: "الشكل النظامي:"
  - code [ref=f3e229]: Tant que <Condition> faire <Liste d'instructions> Fin tant que
  - paragraph [ref=f3e230]: "المعنى: مادام الشرط محققًا يكرر تنفيذ مجموعة من التعليمات إلى غاية عدم تحققه."
  - paragraph [ref=f3e231]: "ملاحظة: الحد الأدنى للتكرارات هو \"1\"."
