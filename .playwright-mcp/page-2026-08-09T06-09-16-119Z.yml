  - heading "2. الخوارزميات" [level=3] [ref=f3e6]
  - heading "الكفاءات المستهدفة" [level=4] [ref=f3e7]
  - list [ref=f3e8]:
    - listitem [ref=f3e9]: يدرك المتعلم مفهوم الخوارزمية.
    - listitem [ref=f3e10]: القدرة على التفكير لحل المشكلات.
    - listitem [ref=f3e11]: يتمكن من كتابة برامج للحاسوب.
  - heading "أصل كلمة خوارزمية" [level=4] [ref=f3e12]
  - paragraph [ref=f3e13]: كلمة خوارزمية مشتقة من اسم العالم الفارسي محمد بن موسى الخوارزمي (780م إلى 840م)، وقد برع هذا العالم في علم الرياضيات والفلك، ووضع مبادئ علم الجبر، وألف كتاب الجبر والمقابلة، واشتغل على جداول الضرب والقسمة والحساب العشري وحساب الظل.
  - paragraph [ref=f3e14]: أطلق هذا الاسم "الخوارزميات" Algorithmes، وظل متداولًا في أوروبا إلى أن حمل مدلولًا جديدًا مرتبطًا بالبرمجة.
  - heading "تعريف الخوارزمية:" [level=4] [ref=f3e15]
  - paragraph [ref=f3e16]: هي مجموعة من الخطوات الرياضية والمنطقية المتسلسلة والمحدودة، اللازمة لحل مسألة ما والوصول إلى نتائج محددة اعتبارًا من معطيات ابتدائية.
  - heading "خصائص الخوارزمية السليمة:" [level=4] [ref=f3e17]
  - list [ref=f3e18]:
    - listitem [ref=f3e19]: كل خطوة يجب أن تكون معروفة دون أي غموض ومحددة بعبارات دقيقة.
    - listitem [ref=f3e20]: أن تتوقف العمليات بعد عدد محدد من الخطوات.
    - listitem [ref=f3e21]: أن تؤدي الخطوات بمجملها إلى الحل الصحيح للمسألة.
  - heading "الهيكل العام للخوارزمية:" [level=4] [ref=f3e22]
  - paragraph [ref=f3e23]: "يشمل الهيكل العام للخوارزمية ثلاث أجزاء أساسية، وهي كالآتي:"
  - paragraph [ref=f3e24]:
    - img "Image" [ref=f3e25]
  - paragraph [ref=f3e26]: "##### جزء En-tête"
  - paragraph [ref=f3e27]: يحتوي هذا الجزء على اسم الخوارزمية الذي يحدد نسبةً للمسألة المراد حلها.
  - paragraph [ref=f3e28]: "##### جزء التصريحات Déclarations"
  - paragraph [ref=f3e29]: يتم في هذا الجزء حجز مكان في الذاكرة لقائمة المتغيرات وقائمة الثوابت التي تستعمل في جزء التعليمات من الخوارزمية.
  - paragraph [ref=f3e30]: "##### جزء التعليمات Instructions"
  - paragraph [ref=f3e31]: "يتضمن هذا الجزء ثلاث مراحل أساسية هي:"
  - list [ref=f3e32]:
    - listitem [ref=f3e33]: "المرحلة الأولى \"المدخلات\": يتم فيها التحضير لحل المسألة وذلك بإدخال المعطيات اللازمة لتنفيذها."
    - listitem [ref=f3e34]: "المرحلة الثانية \"المعالجة\": تتم فيها عملية التنفيذ باستعمال معطيات (مدخلات) المرحلة الأولى، وتحتوي هذه المرحلة على مجموعة من التعليمات اللازمة لحل المسألة."
    - listitem [ref=f3e35]: "المرحلة الثالثة \"المخرجات\": تعرض فيها النتائج المطلوبة."
  - paragraph [ref=f3e36]: "##### الكلمات المحجوزة Mots clés"
  - paragraph [ref=f3e37]: "هي كلمات تتخلل الأجزاء الأساسية الثلاث للهيكل العام للخوارزمية، يمكن كتابتها بأحرف لاتينية كبيرة أو صغيرة دون تفرقة، ولدينا من خلال الهيكل العام الكلمات المحجوزة الآتية:"
  - list [ref=f3e38]:
    - listitem [ref=f3e39]: "Algorithme: نكتب أمام هذه الكلمة اسم الخوارزمية (identificateur)، ويخضع هذا الأخير لقواعد معينة نشير إليها في العنصر الموالي."
    - listitem [ref=f3e40]: "Variable: نكتب هذه الكلمة للتصريح عن المتغيرات."
  - list [ref=f3e41]:
    - listitem [ref=f3e42]: "المتغير: هو عنصر يمكن لمحتواه أن يتغير أثناء تنفيذ الخوارزمية."
    - listitem [ref=f3e43]: "الثابت: هو العنصر الذي لا يتغير محتواه أثناء تنفيذ الخوارزمية."
  - list [ref=f3e44]:
    - listitem [ref=f3e45]: "Constante: نكتب هذه الكلمة للتصريح عن الثوابت."
    - listitem [ref=f3e46]: "Début و Fin: كل من الكلمتين تمثلان بداية ونهاية الخوارزمية، وتوجد بينهما المراحل الثلاث لجزء التعليمات من الخوارزمية."
  - paragraph [ref=f3e47]: "ملاحظة: توجد كلمات محجوزة أخرى يمكن مصادفتها في مختلف أنواع الخوارزميات."
  - paragraph [ref=f3e48]: "أسماء المعرفات هي الأسماء التي تطلق على البيانات سواء كانت معطيات أو نتائج، متغيرة منها أو ثابتة، فكل عنصر نستعمله في الخوارزمية له اسم معرف وحيد. ولتسمية المتغيرات والثوابت لابد من احترام القواعد الآتية:"
  - list [ref=f3e49]:
    - listitem [ref=f3e50]: يمكن لاسم المعرف أن يحتوي على رموز حرفية وعددية من A إلى Z، ومن a إلى z، ومن 0 إلى 9، كما يمكن استعمال الرمز _ (tiret du huit) فقط.
    - listitem [ref=f3e51]: لا يمكن للاسم أن يحتوي على فراغ (مسافة).
    - listitem [ref=f3e52]: يجب أن تبدأ التسمية بحرف.
    - listitem [ref=f3e53]: لا يمكن استعمال أي معرف غير مصرح به في جزء التصريحات.
    - listitem [ref=f3e54]: عدم استعمال أي كلمة من الكلمات المحجوزة في التسمية.
    - listitem [ref=f3e55]: "لتسهيل قراءة وكتابة الخوارزمية، يستحسن استعمال أسماء معرفات ذات دلالة، مثل: Largeur_rect عوض LR."
  - paragraph [ref=f3e56]: "##### ملاحظة: اصطلاحًا، يستحسن كتابة معرفات الثوابت بالأحرف الكبيرة (Majuscules)."
  - heading "أنواع البيانات Types de données" [level=4] [ref=f3e57]
  - list [ref=f3e58]:
    - listitem [ref=f3e59]: "النوع: هو المجال الذي تنتمي إليه البيانات سواء كانت معطيات (مدخلات) أو نتائج (مخرجات)، متغيرة كانت أو ثابتة."
  - paragraph [ref=f3e60]: "يمكننا استعمال عدة أنواع من البيانات في الخوارزمية، نذكر منها الأنواع الأساسية الآتية:"
  - list [ref=f3e61]:
