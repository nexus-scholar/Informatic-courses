    - listitem [ref=f3e63]: Réel (الأعداد الحقيقية).
    - listitem [ref=f3e64]: Caractère (الحروف والرموز).
    - listitem [ref=f3e65]: Chaines de caractères (الكلمات).
    - listitem [ref=f3e66]: "Booléen (منطقي): هذا النوع يتضمن إحدى القيمتين صحيح أو خطأ."
