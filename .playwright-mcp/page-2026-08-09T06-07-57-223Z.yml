  - heading "1.1 التكنولوجيا Technologie" [level=3] [ref=e14]
  - paragraph [ref=e15]: "تكنولوجيا (Technologie) هي كلمة أصلها يوناني technología مركبة من مقطعين:"
  - list [ref=e16]:
    - listitem [ref=e17]: "تكنو (techno): المهارة الفنية"
    - listitem [ref=e18]: "لوجي (logos): علم"
  - paragraph [ref=e19]: وهي تلك المجموعة المتناسقة من المعارف والممارسات في المجال التقني، وتوظيفها بشكل منطقي لتأدية وظيفة محددة وبلوغ أهداف مرجوة.
  - heading "2.1 الإعلام Information" [level=3] [ref=e20]
  - paragraph [ref=e21]: الإعلام لغة هو الإخبار وتقديم المعلومات، ويعني وجود رسالة (أخبار، معلومات، أفكار وآراء) تنتقل من مرسل إلى مستقبل.
  - heading "3.1 الاتصال Communication" [level=3] [ref=e22]
  - paragraph [ref=e23]: الاتصال هو العملية التي يتم بمقتضاها تفاعل بين مرسل ومستقبل ورسالة في مضامين معينة مستعملين أدوات خاصة.
  - paragraph [ref=e24]: "مثل: اللقاءات العلمية، المحاضرات، الندوات، المؤتمرات، الدروس في القسم، ..."
  - heading "تكنولوجيا الإعلام والاتصال Techniques de l'information et de la communication" [level=3] [ref=e25]
  - paragraph [ref=e26]: "تكنولوجيا الإعلام والاتصال (TIC) هي:"
  - list [ref=e27]:
    - listitem [ref=e28]: 1. مجموعة التقنيات
    - listitem [ref=e29]: 2. الأدوات والأجهزة السمعية البصرية
    - listitem [ref=e30]: 3. مختلف الوسائط المتعددة
    - listitem [ref=e31]: 4. الإنترنت والاتصالات
  - paragraph [ref=e32]: ويمكن اختصار المفهوم في أنه ذلك التلاقي والتزاوج بين عتاد وأجهزة الكمبيوتر بمختلف أنواعها والبرمجيات وشبكات الاتصالات.
  - heading "1.1 خصائص تكنولوجيا الإعلام والاتصال" [level=3] [ref=e33]
  - heading "من مميزات وخصائص TIC ما يلي:" [level=3] [ref=e34]
  - list [ref=e35]:
    - listitem [ref=e36]: ربح الوقت والجهد.
    - listitem [ref=e37]: استغلال عقلاني وإيجابي للموارد.
    - listitem [ref=e38]: زيادة الدقة والتقليل من الأخطاء.
    - listitem [ref=e39]: توفير معلومات حديثة وبكميات هائلة.
    - listitem [ref=e40]: جعل الاتصالات أسرع، وأقل تكلفة.
    - listitem [ref=e41]: تستخدم في جميع الميادين.
  - heading "من سلبيات استخدام TIC ما يلي:" [level=3] [ref=e42]
  - paragraph [ref=e43]:
    - img "Image" [ref=e44]
  - list [ref=e45]:
    - listitem [ref=e46]: تشتت الانتباه لمن يستعمله بطريقة مكثفة.
    - listitem [ref=e47]: استخدامها بشكل كلي تقلل من مهارات الإنسان.
    - listitem [ref=e48]: "كثرة الجلوس أمام الحاسوب أو باستعمال الهواتف الذكية واللوحات الرقمية يسبب بعض الأمراض مثل: آلام العمود الفقري، توتر الجهاز العصبي والانطواء، ضعف النظر ..."
  - heading "1.1 إدماج تكنولوجيا الإعلام والاتصال في التعليم TICE" [level=3] [ref=e49]
  - paragraph [ref=e50]: "استخدام التكنولوجيا في العملية التعليمية التعلمية يعتبر تطويرا وإثراء لها وتيسيرا لها، وذلك باستخدام الوسائل التكنولوجية من وسائل صوتية وفيديو وشرائح وغيرها، حيث أصبح الكمبيوتر الأداة الرئيسية التي تركز على نشاط المتعلم وعلى أساليب العمل داخل القسم. ومن أهم خصائصها:"
  - list [ref=e51]:
    - listitem [ref=e52]: التحول من التعليم القائم على التلقين، إلى تعليم يدعم لدى المتعلم القدرة على التفكير والابتكار وتعليم الذات (المقاربة بالكفاءات).
    - listitem [ref=e53]: القدرة على تخزين واسترجاع كم هائل من المعلومات.
    - listitem [ref=e54]: القدرة على العرض المرئي للمعلومات.
    - listitem [ref=e55]: السرعة الفائقة في إجراء العمليات.
    - listitem [ref=e56]: تقديم العديد من الفرص والاختيارات أمام المتعلم.
  - heading "2 المعلوماتية Informatique" [level=3] [ref=e57]
  - list [ref=e58]:
    - listitem [ref=e59]: "مفهوم المعلوماتية: هو ذلك العلم الحديث الذي يعالج المعلومات ويبني البرامج التي يقترحها الإنسان بطريقة آلية وباستعمال جهاز الحاسوب وبرامج خاصة أنشئت لهذا الغرض."
    - listitem [ref=e60]: "وهي المنظومة التي تجمع كل ما يتعلق بأجهزة الحاسوب عبر أبعاده الأربعة:"
    - listitem [ref=e61]: 1. العتاد أو الأجهزة Matériels (Hard)
    - listitem [ref=e62]: 2. البرمجيات Logiciels (Soft)
    - listitem [ref=e63]: 3. الموارد المعرفية
    - listitem [ref=e64]: 4. الموارد البشرية
  - heading "3 تطور تقنية المعلومات" [level=3] [ref=e65]
  - paragraph [ref=e66]: تهتم تقنية المعلومات باستخدام الحواسيب ووسائل الاتصال والتطبيقات من أجل
  - paragraph [ref=e67]: تخزين، معالجة، حماية، إرسال واسترجاع آمن للمعلومات.
  - paragraph [ref=e68]: "لقد مرت بمراحل عدة في تطورها عبر الزمن وبسرعة جد فائقة وصولا إلى ما نحن عليه اليوم، ويمكن تصنيف التطور إلى ثلاثة أصناف هي:"
